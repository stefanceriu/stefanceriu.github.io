name: Update generated data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datagen:
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate data
        run: swift Tools/datagen.swift

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sources/Site/Generated.swift
          git diff --cached --quiet || git commit -m "Update generated data"
          git push
